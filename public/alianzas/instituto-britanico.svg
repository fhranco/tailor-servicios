    <text x="2" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748b" letter-spacing="0.3">SEDE PUNTA ARENAS</text>

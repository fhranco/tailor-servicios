    <text x="112" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#cf142b" letter-spacing="1">BRITÁNICO</text>
